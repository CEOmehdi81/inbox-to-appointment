<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 12px; width: 300px; }
    input, button { font: inherit; }
    input[type="text"], input[type="number"] { width: 100%; padding: 6px 8px; margin-top: 4px; margin-bottom: 10px; }
    button { padding: 8px 10px; border: 0; background: #4f46e5; color: #fff; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .muted { opacity: .7; }
    .row { margin-bottom: 8px; }
  </style>
</head>
<body>
  <h3 style="margin:0 0 8px">HOMI Capture</h3>
  <div class="row">
    <label>Webhook endpoint</label>
    <input id="endpoint" type="text" placeholder="http://127.0.0.1:5681/webhook/agents/discover" />
  </div>
  <div class="row">
    <label>Capture limit (per page)</label>
    <input id="limit" type="number" min="1" max="500" />
  </div>
  <div class="row">
    <button id="save">Save settings</button>
    <button id="toggle" style="margin-left:8px;background:#16a34a">Start/Stop (Ctrl+Shift+H)</button>
  </div>
  <div id="status" class="muted">Queued: — | In-flight: —</div>

  <script>
    async function load() {
      const s = await chrome.storage.local.get({
        endpoint: 'http://127.0.0.1:5681/webhook/agents/discover',
        limit: 50
      });
      document.getElementById('endpoint').value = s.endpoint;
      document.getElementById('limit').value = s.limit;
      refreshStatus();
    }

    function refreshStatus() {
      chrome.runtime.sendMessage({type:'getStatus'}, (st) => {
        if (!st) return;
        document.getElementById('status').textContent =
          `Queued: ${st.queued} | In-flight: ${st.inFlight}`;
      });
    }

    document.getElementById('save').onclick = async () => {
      const endpoint = document.getElementById('endpoint').value.trim();
      const limit = Math.max(1, parseInt(document.getElementById('limit').value, 10) || 50);
      await chrome.storage.local.set({ endpoint, limit });
      alert('Saved.');
    };

    document.getElementById('toggle').onclick = async () => {
      const tabs = await chrome.tabs.query({active: true, lastFocusedWindow: true});
      if (tabs[0]) chrome.tabs.sendMessage(tabs[0].id, {type:'toggle'});
    };

    setInterval(refreshStatus, 1200);
    load();
  </script>
</body>
</html>
